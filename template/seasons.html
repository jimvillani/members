<div class="season topBorder" style="clear:left; margin-top: 12px;" ng-controller="seasonsCtrl">
    <div class="season-col" ng-repeat="x in seasonsData" ng-style=" { 'width' : dataWidth } ">
        <div class="bold season-title">
            {{ x.season }} Concert Dates
        </div>
        <div ng-repeat="y in x.dates">{{ y }}</div>
        <div>&nbsp;</div>
    </div>
</div>
